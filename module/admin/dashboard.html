<div class="farmer-list-card">

    <div class="table-header">

        <h2>🌾 Farmers List</h2>

        <div class="table-actions">

            <div class="show-records">
                Show
                <select id="recordCount">
                    <option>10</option>
                    <option selected>25</option>
                    <option>50</option>
                    <option>100</option>
                </select>
                entries
            </div>

            <input type="text" id="searchFarmer" placeholder="🔍 Search farmer...">

        </div>

    </div>

    <div class="table-wrapper">

        <table id="farmerTable">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Farmer Name</th>
                    <th>Phone</th>
                    <th>City</th>
                    <th>Last Login</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
            </tbody>
        </table>

    </div>

</div>
