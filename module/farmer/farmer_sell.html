<div class="container-fluid py-4">
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">

      <div class="mb-4">
        <h3 class="fw-bold mb-1">Sell Product</h3>
        <p class="text-muted mb-0">
          Add your fresh harvest and make it available to buyers.
        </p>
      </div>

      <div class="row g-4">

        <div class="col-lg-3 col-md-6">
          <label class="form-label">Product Name</label>
          <input type="text" class="form-control" id="productName">
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label">Category</label>
          <select class="form-select" id="category">
            <option>Vegetables</option>
            <option>Fruits</option>
            <option>Grains</option>
            <option>Pulses</option>
            <option>Dairy</option>
            <option>Others</option>
          </select>
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label">Price (₹)</label>
          <input type="number" class="form-control" id="price">
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label">Quantity</label>
          <input type="number" class="form-control" id="quantity">
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label">Unit</label>
          <select class="form-select" id="unit">
            <option>Kg</option>
            <option>Quintal</option>
            <option>Ton</option>
            <option>Piece</option>
            <option>Dozen</option>
          </select>
        </div>


        <div class="col-lg-3 col-md-6">
          <label class="form-label">Harvest Date</label>
          <input type="date" class="form-control" id="harvestDate">
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label">Farm Location</label>
          <input type="text" class="form-control" id="location">
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label">City</label>
          <select class="form-select" id="farmer_city" onchange="onCityChange(this)"></select>
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label">Block Location</label>
          <select class="form-select" id="block_location" onchange="onBlockChange(this)"></select>
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label">Mandi Location</label>
          <select class="form-select" id="mandi_location"></select>
        </div>














        <div class="col-lg-6">
          <label class="form-label">Product Image</label>
          <input type="file" class="form-control" id="image" accept="image/*">
        </div>

        <div class="col-lg-6">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="3" id="description"></textarea>
        </div>

        <div class="col-12 text-end">
          <button class="btn btn-success px-5 py-2" type="button" onclick="addProduct()">
            Add Product
          </button>
        </div>

      </div>

    </div>
  </div>
</div>
