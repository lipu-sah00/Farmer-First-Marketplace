<div class="container-fluid py-4">
  <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="card-header bg-success text-white border-0 py-3 px-4">
      <div class="d-flex align-items-center gap-3">
        <div class="bg-white bg-opacity-25 rounded-circle p-2">
          <i class="bi bi-basket2-fill fs-4"></i>
        </div>
        <div>
          <!-- <h4 class="fw-bold mb-0">Sell Your Product</h4> -->
          <small class="opacity-75">Add your fresh harvest and connect with buyers</small>
        </div>
      </div>
    </div>

    <div class="card-body p-4">
      <!-- Product Information -->
      <div class="d-flex align-items-center gap-2 mb-3">
        <i class="bi bi-box-seam-fill text-success fs-5"></i>
        <h6 class="fw-bold text-success mb-0">Product Information</h6>
      </div>

      <div class="row g-4 mb-4">

        <div class="col-lg-3 col-md-6">
          <label class="form-label fw-semibold">
            <i class="bi bi-grid-fill text-primary me-1"></i>
            Category
          </label>
          <select class="form-select border-primary-subtle" id="category" onchange="onProductSelect(this)">
            <option value="">Select Category</option>
          </select>
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label fw-semibold">
            <i class="bi bi-tag-fill text-success me-1"></i>
            Product Name
          </label>
          <select class="form-select border-success-subtle" id="productName" onchange="onProductNameSelect(this)">
            <option value="">Select Product</option>
          </select>
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label fw-semibold">
            <i class="bi bi-currency-rupee text-warning me-1"></i>
            Price (₹)
          </label>
          <div class="input-group">
            <span class="input-group-text bg-warning-subtle text-warning border-warning-subtle">
              <i class="bi bi-currency-rupee"></i>
            </span>
            <input type="number" class="form-control border-warning-subtle" id="price" placeholder="Enter price">
          </div>
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label fw-semibold">
            <i class="bi bi-stack text-info me-1"></i>
            Quantity
          </label>
          <div class="input-group">
            <span class="input-group-text bg-info-subtle text-info border-info-subtle">
              <i class="bi bi-123"></i>
            </span>
            <input type="number" class="form-control border-info-subtle" id="quantity" placeholder="Enter quantity">
          </div>
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label fw-semibold">
            <i class="bi bi-rulers text-danger me-1"></i>
            Unit
          </label>
          <select class="form-select border-danger-subtle" id="unit">
            <option value="Kg">Kg</option>
            <option value="Quintal">Quintal</option>
            <option value="Ton">Ton</option>
            <option value="Piece">Piece</option>
            <option value="Dozen">Dozen</option>
          </select>
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label fw-semibold">
            <i class="bi bi-calendar-event-fill text-primary me-1"></i>
            Harvest Date
          </label>
          <input type="date" class="form-control border-primary-subtle" id="harvestDate">
        </div>

        <div class="col-lg-6">
          <label class="form-label fw-semibold">
            <i class="bi bi-card-text text-secondary me-1"></i>
            Description
          </label>
          <textarea class="form-control border-secondary-subtle" rows="1" id="description"
            placeholder="Describe your product..."></textarea>
        </div>

      </div>

      <hr class="my-4">

      <!-- Location Information -->
      <div class="d-flex align-items-center gap-2 mb-3">
        <i class="bi bi-geo-alt-fill text-danger fs-5"></i>
        <h6 class="fw-bold text-danger mb-0">Location Information</h6>
      </div>

      <div class="row g-4 mb-4">

        <div class="col-lg-3 col-md-6">
          <label class="form-label fw-semibold">
            <i class="bi bi-house-fill text-success me-1"></i>
            Farm Location
          </label>
          <input type="text" class="form-control border-success-subtle" id="location" placeholder="Enter farm location">
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label fw-semibold">
            <i class="bi bi-buildings-fill text-primary me-1"></i>
            City
          </label>
          <select class="form-select border-primary-subtle" id="farmer_city" onchange="onCityChange(this)">
            <option value="">Select City</option>
          </select>
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label fw-semibold">
            <i class="bi bi-signpost-2-fill text-warning me-1"></i>
            Block Location
          </label>
          <select class="form-select border-warning-subtle" id="block_location" onchange="onBlockChange(this)">
            <option value="">Select Block</option>
          </select>
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label fw-semibold">
            <i class="bi bi-shop-window text-danger me-1"></i>
            Mandi Location
          </label>
          <select class="form-select border-danger-subtle" id="mandi_location">
            <option value="">Select Mandi</option>
          </select>
        </div>

      </div>

      <hr class="my-4">

      <!-- Image & Submit -->
      <div class="d-flex align-items-center gap-2 mb-3">
        <i class="bi bi-image-fill text-info fs-5"></i>
        <h6 class="fw-bold text-info mb-0">Product Image</h6>
      </div>

      <div class="row g-4 align-items-end">

        <div class="col-lg-8">
          <label class="form-label fw-semibold">
            <i class="bi bi-camera-fill text-info me-1"></i>
            Upload Product Image
          </label>
          <input type="file" class="form-control border-info-subtle" id="image" accept="image/*">
          <div class="form-text">
            <i class="bi bi-info-circle-fill text-info me-1"></i>
            Upload a clear image of your fresh product.
          </div>
        </div>

        <div class="col-lg-4 text-lg-end">
          <button class="btn btn-success btn-lg px-5 rounded-3 shadow-sm" type="button" onclick="addProduct()">
            <i class="bi bi-plus-circle-fill me-2"></i>
            Add Product
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
