<div class="product-search-wrapper mb-4">
  <div class="input-group product-search">
    <span class="input-group-text">
      <i class="bi bi-search"></i>
    </span>
    <input type="search" id="productSearch" class="form-control" placeholder="Search products..." oninput="searchProducts(this.value)">
    <button class="btn btn-success search-btn" type="button" onclick="searchProducts()">
      <i class="bi bi-search me-1"></i>Search
    </button>
  </div>
</div>
<div id="buyerProducts" class="products-container"></div>
